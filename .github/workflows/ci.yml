name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --all -- --check
      - run: cargo +1.95.0 check --workspace --all-targets --locked
      - run: cargo +1.95.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 --config profile.test.package.vmkek.opt-level=2 test --workspace --locked
      - run: python3 -B -m unittest discover -s evaluation

  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --locked -p vmkek-protocol -p vmkek-runtime --lib
