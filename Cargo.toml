[package]
name = "vmkek"
version = "0.1.0"
edition = "2021"
description = "Protector for PE32+ x86-64 images, including native drivers: obfuscation, virtualization, and mutation"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
anyhow = "1"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
iced-x86 = { version = "1.21", features = ["code_asm", "instr_info"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
thiserror = "2"
toml = "0.8"

[[test]]
name = "r02_process"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
lto = false
codegen-units = 1

[workspace]
members = [".", "gui", "crates/protocol", "crates/runtime", "crates/server", "crates/client", "crates/packager", "samples/online"]
default-members = [".", "gui", "crates/protocol", "crates/runtime", "crates/server", "crates/client", "crates/packager", "samples/online"]
resolver = "2"
