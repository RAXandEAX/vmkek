[package]
name = "vmkek-protocol"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[features]
r06-experimental = []

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }
