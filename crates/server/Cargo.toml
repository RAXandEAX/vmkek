[package]
name = "vmkek-server"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
chacha20poly1305 = "0.10"
axum = { version = "0.8.8", default-features = false, features = ["json", "http1", "tokio"] }
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }
vmkek-packager = { path = "../packager" }
vmkek-protocol = { path = "../protocol" }
zeroize = "1.8"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
vmkek-client = { path = "../client" }
